[project]
name = "sessionarchive"
version = "0.1.0"
description = "Semantic search + knowledge graph over a folder of session logs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "sentence-transformers",
    "faiss-cpu",
    "neo4j>=5.10.0",
    "requests>=2.31.0",
    "rich",
    "scikit-learn",
    "torch",
    "numpy",
]

[project.scripts]
sessionarchive = "sessionarchive.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sessionarchive"]
