services:
  neo4j:
    image: neo4j:latest
    container_name: cosmosgl-dashboard-neo4j
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-27474}:7474"  # HTTP Browser Console
      - "127.0.0.1:${NEO4J_BOLT_PORT:-27687}:7687"  # Bolt Protocol (queries)
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j-logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password123
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: cosmosgl-dashboard-server
    depends_on:
      - neo4j
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-28686}:8686"
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - PORT=8686
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8686/api/graph', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # GPU ForceAtlas2 layout precompute. One-shot job, not a daemon — run
  # explicitly with `docker compose run --rm layout` whenever the graph
  # topology changes and node positions need recomputing. Requires the
  # NVIDIA Container Toolkit on the host with a generated CDI spec
  # (`sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`) — the
  # legacy `deploy.resources.reservations.devices: driver: nvidia` syntax
  # requires a registered "nvidia" Docker runtime instead, which this
  # CDI-based passthrough doesn't provide.
  layout:
    build:
      context: .
      dockerfile: Dockerfile.layout
    container_name: cosmosgl-dashboard-layout
    depends_on:
      - neo4j
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
    devices:
      - "nvidia.com/gpu=0"
